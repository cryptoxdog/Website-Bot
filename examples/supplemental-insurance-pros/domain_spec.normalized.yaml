business_facts:
  legal_name: Supplemental Insurance Pros
  tagline: Insurance supplementing support for homeowners and contractors.
  brand_positioning: Licensed public adjuster-led insurance supplementing support for homeowners and contractors across Tennessee and bordering states.
  primary_value: Help property claim stakeholders identify missed scope, organize documentation, and pursue legitimate claim supplements without overpromising carrier outcomes.
  competitive_angle: Licensed public adjuster with over 20 years of experience serving both homeowners and contractors.
  core_offer: Insurance claim supplementing and estimate review support.
  offer_type: service
  pricing_visibility: quote_based
  deliverables:
    - estimate_review
    - scope_gap_summary
    - supplement_documentation_guidance
    - claim_support_intake
  decision_makers:
    - homeowner
    - contractor_owner
    - project_manager
  pain_points:
    - claim_scope_missing_items
    - estimate_does_not_match_real_repair_cost
    - supplement_documentation_is_disorganized
    - claim_language_is_confusing
    - contractor_needs_scope_support_without_overbuilding_internal_staff
  trust_requirements:
    - licensed_public_adjuster_status
    - over_20_years_experience_claim
    - clear_no_guarantee_disclaimer
    - plain_english_process
    - conservative_compliance_language
  service_area_model: state_based
  service_lines:
    - Insurance Supplementing
    - Homeowner Claim Review
    - Contractor Supplement Support
  credibility_claims:
    - Licensed Public Adjuster
    - Over 20 years of experience
    - Homeowner and contractor support
value_proposition:
  status: locked
  target_customer:
    - Homeowners who need help reviewing a property insurance estimate or claim supplement.
    - Contractors who need supplement support and organized documentation for covered repair scope.
  problem:
    - Property claim estimates may omit legitimate covered scope or cost items.
    - Supplement documentation can be incomplete, disorganized, or difficult to understand.
    - Homeowners and contractors need claim-literate support without promises about carrier outcomes.
  outcome:
    - Identify potential scope gaps in the available claim or estimate information.
    - Organize documentation into a supplement-ready structure.
    - Understand the supplementing process and realistic next steps.
  mechanism:
    - Licensed public adjuster-led estimate and claim-scope review.
    - Scope-gap analysis and supplement documentation guidance.
    - Separate homeowner and contractor support paths.
  differentiators:
    - Licensed public adjuster-led service.
    - Over 20 years of experience.
    - Support for both homeowners and contractors.
    - Conservative compliance-first claim language.
  reasons_to_believe:
    - Licensed Public Adjuster
    - Over 20 years of experience
    - Homeowner and contractor support
  boundaries:
    - No guaranteed claim payment.
    - No guaranteed claim increase.
    - No guaranteed carrier approval.
    - No carrier outcome promises.
    - No legal advice unless explicitly approved.
