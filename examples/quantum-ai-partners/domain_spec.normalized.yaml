routes:
  - slug: /
    title: Home
    components:
      - hero
      - trust_bar
      - services_overview
      - differentiation
      - process
      - faq
      - final_cta
    purpose: Position the company, route the three audience segments, show the layered services model, and capture email conversions.
    template: homepage
    priority: 1
  - slug: /services
    title: Services
    components:
      - hero
      - services_overview
      - engagement_models
      - process
      - faq
      - cta
    purpose: Explain the three service lines and how they compose into one layered engagement.
    template: services_page
    priority: 2
  - slug: /approach
    title: Approach
    components:
      - hero
      - process
      - principles
      - stack
      - faq
      - cta
    purpose: Explain the layered systems methodology — strategy, build, production hardening — with real depth, no hype.
    template: approach_page
    priority: 3
  - slug: /about
    title: About
    components:
      - hero
      - positioning
      - trust_bar
      - cta
    purpose: State who Quantum AI Partners is and what it stands for, without unverified credentials.
    template: about_page
    priority: 4
  - slug: /faq
    title: FAQ
    components:
      - hero
      - faq
      - cta
    purpose: Answer cost, process, technology, security, and engagement questions.
    template: faq_page
    priority: 5
  - slug: /contact
    title: Contact
    components:
      - hero
      - contact_options
      - cta
    purpose: Primary conversion page — email and intro-call path.
    template: contact_page
    priority: 6
