build_intent: REDESIGN_IMPROVE
client_vision:
  desired_outcomes:
    - Position Quantum AI Partners as a distinctive, engineering-deep AI partner — never a generic AI consultancy template.
    - Convert visitors into intro-call and email inquiries through a clear, low-friction path.
    - Communicate layered-systems depth (strategy to build to production) without hype.
  brand_attributes:
    - distinctive
    - graphically_rich
    - engineering_deep
    - calm
    - precise
    - no_hype
  visual_preferences:
    - dark_dramatic_canvas
    - layered_depth_via_subtle_gradients
    - electric_cyan_accent_family
    - bold_hero_typography
    - smooth_navigation
    - generous_whitespace
  liked_examples:
    - "Palantir: distinctive, graphically stunning presentation"
    - "Baseten: layered stack graphics that explain depth"
    - "Modal: crisp technical product graphics"
    - "NVIDIA App: smooth, easy navigation"
    - "Linear: clean, restrained composition"
  disliked_examples:
    - "Mintlify: the client does not like Mintlify"
    - "Vercel: the client calls the marketing site too lame"
    - "Linear: too generic, no wow factor at all"
    - "Modal: the purple-dominant color palette"
  preserve: []
  change:
    - generic_minimal_saas_layout
    - purple_dominant_palette
    - hype_heavy_marketing_copy
    - low_density_feature_laundry_landing_pages
  conversion_priorities:
    - intro_call_booking
    - email_inquiry
    - clear_pricing_signals
    - no_dead_forms
  explicit_constraints:
    - dark_canvas_first
    - no_purple_or_violet_accents
    - distinctive_over_generic
    - layered_depth_visuals
    - wcag_aa_contrast
    - fast_perceived_performance
  palette:
    primary: "#22D3EE"
    secondary: "#38BDF8"
    accent: "#A5F3FC"
    background: "#0B0F17"
    text: "#E6EDF7"
