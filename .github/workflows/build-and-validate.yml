# L9_META: layer=configuration, role=tracked_file, status=active, version=1.0.0
name: Build and Validate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: build-and-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@quantum-l9'
      - run: npm ci --no-audit --no-fund --ignore-scripts && npm rebuild better-sqlite3
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Spec drift and validity guard
        run: npm run normalize-spec:check
      - name: Release evidence JSON Schemas
        run: npm run evidence:schemas
      - name: Cross-repository contract lock
        run: npm run evidence:contract-parity
      - name: Release evidence subsystem tests
        run: npm run evidence:test
      - name: Site-factory structural proof
        run: npm run site:validate
      # The local suite drives a real browser
      # (tests/integration/local/rendered-site-browser.test.ts). A missing
      # browser is a gate failure, not a skip, so the binary is provisioned
      # here exactly as ci.yml does.
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Site-factory deterministic local tests
        run: npm run site:test:local
      - name: Provisioning transaction tests
        run: npm run provision:test
      - name: Plan-mode pipeline proof
        run: npm run pipeline:plan
        env:
          NODE_ENV: test
      - name: LLM wiring guard (no stub in content path)
        run: npm run llm:wiring
      - name: Run launch env verification (optional)
        run: |
          if [ -f scripts/verify-launch-env.mjs ]; then
            node scripts/verify-launch-env.mjs --ci
          else
            echo "verify-launch-env.mjs not present; skipping"
          fi
      - name: Evidence-driven validation executor (aggregate profile)
        run: node --import tsx packages/validation-executor/src/cli.ts run --profile ci --evidence-root validation --output validation_report.yaml
      - name: Upload validation executor report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-executor-report
          path: validation_report.yaml
          if-no-files-found: warn
          retention-days: 14
