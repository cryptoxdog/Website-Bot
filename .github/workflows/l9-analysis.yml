# L9 Governed Analysis Pipeline — TypeScript Preset (LOCKED)
#
# DO NOT EDIT — this file is managed by l9-ci-core presets/typescript.
# To update, pull the latest preset from Quantum-L9/l9-ci-core.
#
# This workflow runs the full L9 analysis pipeline:
#   1. Resolve governance config from .github/governance/
#   2. Run semgrep with TypeScript/JavaScript rulesets
#   3. Provision the SDK (immutable, pinned)
#   4. Normalize → Validate → Project → Route → Manifest → Upload
#   5. Publish results as GitHub Checks
name: L9 Analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  L9_CORE_REF: "f88116503430aa18992b70d8d31063e34ff97ef1"
  # pr_fast only allows pull_request events; pushes to main must resolve
  # under the merge profile or resolve-governance fails closed with
  # "event 'push' is not allowed" (exit 2).
  L9_PROFILE: ${{ github.event_name == 'pull_request' && 'pr_fast' || 'merge' }}
  L9_MATRIX_ID: "pr-semgrep"
  # Pinned provider version — analysis output must not change because PyPI moved.
  SEMGREP_VERSION: "1.176.1"

# Workflow-level default is read-only. `checks: write` and the `security-events:
# write` that publish-analysis.yml needs for its SARIF upload are granted per job
# below, so no job carries a write scope it does not use (githubactions:S8233).
permissions:
  contents: read

concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Governed Semgrep Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.gov.outputs.enabled }}
      mode: ${{ steps.gov.outputs.mode }}
      governance-digest: ${{ steps.gov.outputs.governance-digest }}
      artifact-name: ${{ steps.names.outputs.artifact-name }}
    permissions:
      contents: read
      checks: write
      security-events: write
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - id: gov
        name: Resolve governance
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@7148fc73dcbf41367f5c5401432dc997b1f4f869
        with:
          profile: ${{ env.L9_PROFILE }}
          provider: semgrep
          event-name: ${{ github.event_name }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - id: names
        name: Compute artifact names
        env:
          MATRIX_ID: ${{ env.L9_MATRIX_ID }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - id: scan
        name: Run semgrep
        if: steps.gov.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # Pinned + wheel-only: an unpinned install resolves a different
          # provider on every run, and a source distribution would execute its
          # own setup script on this runner (githubactions:S8544, S8541).
          pip install --only-binary :all: "semgrep==${SEMGREP_VERSION}"
          mkdir -p "artifacts/raw/semgrep/${L9_MATRIX_ID}"
          echo "provider-version=$(semgrep --version)" >> "$GITHUB_OUTPUT"
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --json \
            --output "artifacts/raw/semgrep/${L9_MATRIX_ID}/report.json" \
            --error --quiet || true
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --sarif \
            --output "artifacts/raw/semgrep/${L9_MATRIX_ID}/results.sarif" \
            --quiet || true
        env:
          L9_MATRIX_ID: ${{ env.L9_MATRIX_ID }}
          SEMGREP_VERSION: ${{ env.SEMGREP_VERSION }}

      - id: sdk
        name: Provision immutable SDK
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@4c842cb838b6c49cf44681ecc683a432538fd348

      - name: Normalize provider report
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@4c842cb838b6c49cf44681ecc683a432538fd348
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-normalize
          input: artifacts/raw/semgrep/${{ env.L9_MATRIX_ID }}/report.json
          output: .l9/runtime/${{ env.L9_MATRIX_ID }}/finding-bundle.json
          root: .
          snapshot-id: ${{ github.sha }}
          revision: ${{ github.sha }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs.required-provider }}
          policy: ${{ steps.gov.outputs.sdk-policy }}
          identity-map: .github/governance/semgrep-identity-map.yaml
          provider-version: ${{ steps.scan.outputs.provider-version }}

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@7148fc73dcbf41367f5c5401432dc997b1f4f869
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ env.L9_MATRIX_ID }}/finding-bundle.json

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@4c842cb838b6c49cf44681ecc683a432538fd348
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ env.L9_MATRIX_ID }}/finding-bundle.json
          output: .l9/runtime/${{ env.L9_MATRIX_ID }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@4c842cb838b6c49cf44681ecc683a432538fd348
        with:
          provider: semgrep
          matrix-id: ${{ env.L9_MATRIX_ID }}
          raw-report: artifacts/raw/semgrep/${{ env.L9_MATRIX_ID }}/report.json
          bundle: .l9/runtime/${{ env.L9_MATRIX_ID }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ env.L9_MATRIX_ID }}/agent-review-payload.json
          destination-root: artifacts

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@373bb6d26084e67ef76aaab95021364182a34ee7
        with:
          provider: semgrep
          matrix-id: ${{ env.L9_MATRIX_ID }}
          sdk-revision: ${{ steps.sdk.outputs.sdk-revision }}
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs.agent-payload }}
          raw-directory: ${{ steps.route.outputs.raw-directory }}
          output: artifacts/metadata/${{ env.L9_MATRIX_ID }}/artifact-manifest.json

      - name: Upload Semgrep SARIF to code scanning
        if: steps.gov.outputs.enabled == 'true' && hashFiles('artifacts/raw/semgrep/pr-semgrep/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v3
        with:
          sarif_file: artifacts/raw/semgrep/${{ env.L9_MATRIX_ID }}/results.sarif
          category: l9-pr-semgrep

      - name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          path: |
            artifacts/raw/semgrep/${{ env.L9_MATRIX_ID }}/
            artifacts/l9/${{ env.L9_MATRIX_ID }}/
            artifacts/metadata/${{ env.L9_MATRIX_ID }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish analysis (Core)
    needs: analyze
    if: needs.analyze.outputs.enabled == 'true'
    uses: Quantum-L9/l9-ci-core/.github/workflows/publish-analysis.yml@4c842cb838b6c49cf44681ecc683a432538fd348
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      artifact-name: ${{ needs.analyze.outputs.artifact-name }}
      profile: pr_fast
      mode: ${{ needs.analyze.outputs.mode }}
      provider: semgrep
      matrix-id: pr-semgrep
      governance-digest: ${{ needs.analyze.outputs.governance-digest }}
      repository-revision: ${{ github.sha }}
      workflow-result: ${{ needs.analyze.result }}
