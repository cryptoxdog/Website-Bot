# Managed by Quantum-L9/.github. Pinned to a tag so main can move safely.
#
# This file should never need editing again. Governance logic lives in
# Quantum-L9/.github/.github/workflows/governance-*.yml; shipping a change means
# force-moving the v1 tag there, not touching this file.
#
# SECRETS: a called workflow does NOT inherit caller secrets automatically. Today
# both callees use only the automatic GITHUB_TOKEN, so nothing is passed. If a
# governance job later needs a real secret, add `secrets:` to the job below —
# `inherit` for all, or named entries (preferred, least privilege).
# See docs/DISTRIBUTION.md Appendix A.
#
# PERMISSIONS: each job MUST declare its own job-level `permissions:`. A called
# workflow does not inherit the caller's default token scope — it declares what
# it needs (governance-pr.yml wants `pull-requests: write`), and GitHub validates
# that grant BEFORE the `if:` skip is evaluated. Omit the block and every run
# ends `startup_failure` before a single step, with no log to read. That is what
# happened here: every run of this workflow failed that way until 2026-08-27.
# Peer reference: Quantum-L9/SEO-Bot/.github/workflows/governance.yml.
#
# ACCESS: if this caller fails before any step runs AND the jobs below already
# declare permissions, check the Actions policy on THIS repo — see Appendix B.
# `gh api repos/OWNER/REPO/actions/permissions`

name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, edited, reopened]

jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Quantum-L9/.github/.github/workflows/governance-pr.yml@7ed3ab8650583f6659a6caf061eae77dbd3ed1be  # v1
    # secrets: inherit

  issue:
    if: github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
    uses: Quantum-L9/.github/.github/workflows/governance-issue.yml@3e841ea4f7f8be2a8c9fc45cad5bed46fe801d08  # v1
    # secrets: inherit
